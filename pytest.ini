[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --tb=short
markers =
    allow_contained_exceptions: this test deliberately provokes a failure that
        the product catches and logs rather than raising. The autouse
        `_no_contained_exceptions` fixture in conftest.py fails a test that
        logs a swallowed exception; this marker opts out of that check. Say in
        the test why the containment is expected.
